name: Publish to Visual Studio Marketplace

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    name: Admit, verify, and package
    runs-on: ubuntu-latest
    outputs:
      vsix_name: ${{ steps.attest.outputs.vsix_name }}
      vsix_sha256: ${{ steps.attest.outputs.vsix_sha256 }}
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Admit tag from canonical main before executing release code
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release and extension identity
        id: release
        run: node scripts/validate-marketplace-release.mjs "$GITHUB_EVENT_PATH"

      - name: Reconfirm exact admitted tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main

      - name: Run complete release gate
        run: npm run verify

      - name: Package exact Marketplace artefact
        env:
          VSIX_NAME: ${{ steps.release.outputs.vsix_name }}
        run: npx vsce package --no-dependencies --out "$VSIX_NAME"

      - name: Attest exact Marketplace artefact
        id: attest
        env:
          VSIX_NAME: ${{ steps.release.outputs.vsix_name }}
        run: |
          vsix_sha256="$(sha256sum "$VSIX_NAME" | cut -d ' ' -f 1)"
          test -n "$vsix_sha256"
          echo "vsix_name=$VSIX_NAME" >> "$GITHUB_OUTPUT"
          echo "vsix_sha256=$vsix_sha256" >> "$GITHUB_OUTPUT"

      - name: Transfer reviewed Marketplace artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketplace-vsix
          path: ${{ steps.release.outputs.vsix_name }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Authenticate and publish
    needs: verify
    runs-on: ubuntu-latest
    environment: marketplace-production
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Download reviewed Marketplace artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marketplace-vsix
          path: release-artifact

      - name: Verify transferred artefact identity
        env:
          VSIX_NAME: ${{ needs.verify.outputs.vsix_name }}
          EXPECTED_VSIX_SHA256: ${{ needs.verify.outputs.vsix_sha256 }}
        run: |
          test -n "$VSIX_NAME"
          test -n "$EXPECTED_VSIX_SHA256"
          test "$(sha256sum "release-artifact/$VSIX_NAME" | cut -d ' ' -f 1)" = "$EXPECTED_VSIX_SHA256"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Authenticate as Marketplace publishing identity
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish controlled successor identity
        env:
          VSIX_NAME: ${{ needs.verify.outputs.vsix_name }}
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath "release-artifact/$VSIX_NAME" --azure-credential --skip-duplicate --no-dependencies
