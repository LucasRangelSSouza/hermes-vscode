name: Identify Marketplace publishing principal

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  identify:
    name: Resolve Azure DevOps identity
    runs-on: ubuntu-latest
    environment: marketplace-production
    steps:
      - name: Check out bootstrap tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Authenticate as Marketplace publishing identity
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Marketplace member user ID
        shell: bash
        run: |
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT

          set +e
          npx vsce verify-pat --azure-credential stefanpieter >"$output_file" 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            {
              echo '## Marketplace publishing principal'
              echo
              echo 'The workload identity already has publisher access.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          resource_id="$(node -e '
            const fs = require("node:fs");
            const text = fs.readFileSync(process.argv[1], "utf8");
            const match = text.match(/Access Denied:\s*([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\s+needs\b/i);
            if (match) process.stdout.write(match[1]);
          ' "$output_file")"

          if [ -z "$resource_id" ]; then
            echo 'Marketplace verification failed without exposing the expected managed-identity user ID.' >&2
            exit 1
          fi

          echo "::notice title=Marketplace publishing principal::$resource_id"
          {
            echo '## Marketplace publishing principal'
            echo
            echo 'Add this Marketplace user ID as a Contributor to publisher `stefanpieter`:'
            echo
            printf '`%s`\n' "$resource_id"
          } >> "$GITHUB_STEP_SUMMARY"
