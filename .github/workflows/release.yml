name: Release

# Builds the VSIX from a version tag, verifies it, and attaches it to a GitHub Release together with
# its SHA-256. The Marketplace listing is a separate, later step (see docs/releasing.md).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          if [ "$base" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi

      - run: npm ci

      - name: Complete verification gate
        run: npm run verify

      - name: Name and hash the VSIX
        id: vsix
        run: |
          version=$(node -p "require('./package.json').version")
          name="hermes-by-rangel-tech-${GITHUB_REF_NAME#v}.vsix"
          mv hermes-by-rangel-tech-ci.vsix "$name"
          sha256sum "$name" > "$name.sha256"
          cat "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" $flags --generate-notes \
            --title "Hermes by Rangel Tech ${GITHUB_REF_NAME#v}" \
            "${{ steps.vsix.outputs.name }}" "${{ steps.vsix.outputs.name }}.sha256"
